<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChromeTether Containers</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 340px;
        margin: 0;
        padding: 12px;
        background: #0f172a;
        color: #f8fafc;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .title {
        font-weight: 700;
        font-size: 14px;
      }
      .status {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #065f46;
        color: #6ee7b7;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      input,
      select,
      button {
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f8fafc;
        padding: 6px 8px;
      }
      input {
        flex: 1;
      }
      button {
        cursor: pointer;
        font-weight: 600;
        background: #2563eb;
        border-color: #3b82f6;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button.secondary {
        background: #334155;
        border-color: #475569;
      }
      button.danger {
        background: #7f1d1d;
        border-color: #991b1b;
        padding: 4px 7px;
      }
      .note {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 8px;
        line-height: 1.35;
      }
      .list {
        margin-top: 10px;
        border-top: 1px solid #1e293b;
        padding-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 240px;
        overflow-y: auto;
      }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #1e293b;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
      }
      .meta {
        font-size: 10px;
        color: #94a3b8;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="title">ChromeTether Containers</span>
      <span id="hub-status" class="status">Ready</span>
    </div>

    <div class="row">
      <input id="container-name" type="text" placeholder="Name (e.g. acc-1, acc-2)" value="acc-1" />
      <select id="container-color">
        <option value="blue">🔵 Blue</option>
        <option value="orange">🟠 Orange</option>
        <option value="green">🟢 Green</option>
        <option value="purple">🟣 Purple</option>
        <option value="pink">🩷 Pink</option>
        <option value="cyan">🩵 Cyan</option>
      </select>
    </div>

    <div class="row">
      <button id="btn-create" class="secondary" style="flex: 1">+ Save Container</button>
      <button id="btn-open" style="flex: 1">+ New Container Tab</button>
    </div>

    <div class="row">
      <button id="btn-convert" class="secondary" style="width: 100%">
        Move Current Tab into Selected Container
      </button>
    </div>

    <div id="containers-list" class="list"></div>

    <div class="note">
      Works 100% standalone or with AI Agents. Containers created here automatically sync when the AI Hub connects.
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
